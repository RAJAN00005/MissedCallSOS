name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MissedCall SOS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment and Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ -f debug.keystore.base64 ]; then
            keytool -importkeystore \
              -srckeystore debug.keystore \
              -srcstoretype PKCS12 \
              -srcstorepass android \
              -srcalias androiddebugkey \
              -destkeystore my-upload-key.jks \
              -deststoretype PKCS12 \
              -deststorepass android \
              -destalias upload \
              -destkeypass android \
              -noprompt
          else
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -storetype PKCS12 \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RAAJAN,OU=MissedCallSOS,O=MissedCallSOS,C=IN"
          fi

      - name: Extract App Version and Release Tag
        id: meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode =' app/build.gradle.kts | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/MissedCall-SOS.apk
          ls -lh release/MissedCall-SOS.apk
          sha256sum release/MissedCall-SOS.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissedCall-SOS-${{ steps.meta.outputs.tag }}-APK
          path: release/MissedCall-SOS.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MissedCall SOS ${{ steps.meta.outputs.tag }}
          files: release/MissedCall-SOS.apk
          body: |
            ## MissedCall SOS ${{ steps.meta.outputs.tag }} (Build ${{ steps.meta.outputs.version_code }})

            ### Direct Installation
            1. Download **`MissedCall-SOS.apk`** from the Assets section below.
            2. Tap the downloaded APK and allow **Install unknown apps** if prompted.
            3. Open **MissedCall SOS** and complete the quick permission setup.
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
